apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    uid: mimir
    isDefault: true
    jsonData:
      httpMethod: POST
      # The browser export interval. $__rate_interval is then at least 4 x 15 s.
      timeInterval: 15s
      # Mimir stores the trace ID of an OTLP exemplar in the label trace_id.
      # The span metrics of Alloy have such exemplars (config/alloy/config.alloy).
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          matcherType: regex
        # A log record in the context of a span (each Node service of the fleet,
        # with otel-ts) has the trace ID. Loki keeps it as the structured
        # metadata trace_id, so a log line opens its trace.
        - name: Trace
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          matcherType: label
          urlDisplayLabel: Open the trace
        # The lag.page_view.start event has the trace ID of its page view. Loki
        # keeps it as the structured metadata lag_page_view_trace_id. A label
        # matcher reads it, thus Explore shows a link to the trace in Tempo.
        - name: Page view trace
          matcherRegex: lag_page_view_trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          matcherType: label
          urlDisplayLabel: Open the trace of the page view

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToMetrics:
        datasourceUid: mimir
      # "Logs for this span", from 1 minute before the span to 1 minute after it:
      # the lines of the trace (a Node service writes them with the trace_id),
      # and the lag events of the same page load (the same service.instance.id).
      # Loki keeps service.name as the label service_name, and trace_id and
      # service.instance.id as structured metadata. A span with no
      # service.instance.id matches only by the trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}" or (service_instance_id="$${__span.tags["service.instance.id"]}" and service_instance_id!="")'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
