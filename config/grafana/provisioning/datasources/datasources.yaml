apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    uid: mimir
    isDefault: true
    jsonData:
      httpMethod: POST
      # The browser export interval. $__rate_interval is then at least 4 x 15 s.
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          matcherType: regex
        # The lag.page_view.start event has the trace ID of its page view. Loki
        # keeps it as the structured metadata lag_page_view_trace_id. A label
        # matcher reads it, thus Explore shows a link to the trace in Tempo.
        - name: Page view trace
          matcherRegex: lag_page_view_trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          matcherType: label
          urlDisplayLabel: Open the trace of the page view

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToMetrics:
        datasourceUid: mimir
      # "Logs for this span": the lag events of the same page load, from 1 minute
      # before the span to 1 minute after it. Loki keeps service.name as the
      # label service_name, and service.instance.id as structured metadata.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | service_instance_id="$${__span.tags["service.instance.id"]}"'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
