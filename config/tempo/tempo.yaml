server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# The span metrics and the service graph come from Alloy, before its tail
# sampler (config/alloy/config.alloy). Here they would count only the traces
# that the sampler keeps. The generator keeps only local-blocks: the TraceQL
# metrics queries of Grafana (rate(), quantile_over_time()) read its blocks.
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks
