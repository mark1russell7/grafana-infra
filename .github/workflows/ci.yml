# This workflow examines the site package: its types, its tests and its build.
# The scheduled Pages run asks for a green run of this workflow on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each rule of @mark1russell7/conventions, with the settings in package.json. It reads the files, so it needs no build.
      - run: pnpm check:conventions
      - run: pnpm --filter @grafana-infra/site run typecheck
      - run: pnpm --filter @grafana-infra/site run test
      - run: pnpm --filter @grafana-infra/site run build

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site-check:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@7c83f30551e066c06852ea75bf0140eadfc49961 # main
    permissions:
      contents: read

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [site, site-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@7c83f30551e066c06852ea75bf0140eadfc49961 # main
        with:
          needs: ${{ toJSON(needs) }}
