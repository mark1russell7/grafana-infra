name: Verify

# The stack end to end: start it, send sample telemetry in the form of the
# lag library and of a Node service with otel-ts, check every metric, event,
# trace, link, panel query and annotation layer, and take screenshots of the
# dashboard and the traces for review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Stack, sample data and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The version comes from packageManager in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The dashboard file agrees with scripts/build-dashboards.mjs
        run: |
          node scripts/build-dashboards.mjs
          git diff --exit-code config/grafana/provisioning/dashboards/
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for Alloy, Mimir, Loki, Tempo and Grafana
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:12345/-/ready && curl -fsS http://localhost:9009/ready \
              && curl -fsS http://localhost:3100/ready && curl -fsS http://localhost:3200/ready \
              && curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 5
          done
          echo "The stack did not become ready in 5 minutes" >&2
          exit 1
      - name: Send sample data
        run: node scripts/send-sample-data.mjs --summary sample-summary.json
      - name: Send the data of a sample Node service (otel-ts)
        run: node scripts/send-node-service-data.mjs --summary node-summary.json
      - name: Verify the pipeline and the dashboard
        run: node scripts/verify-pipeline.mjs --summary sample-summary.json --node-summary node-summary.json
      # The tail sampler of Alloy at 0 percent: Tempo keeps only the traces with
      # an error, and the span metrics still count each request
      - name: Restart Alloy with TRACE_SAMPLE_PERCENT=0
        shell: bash
        run: |
          TRACE_SAMPLE_PERCENT=0 docker compose up -d alloy
          docker compose exec -T alloy printenv TRACE_SAMPLE_PERCENT | grep -qx 0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:12345/-/ready; then exit 0; fi
            sleep 2
          done
          echo "Alloy did not become ready in 2 minutes" >&2
          exit 1
      - name: Send a Node sample through the sampler
        run: node scripts/send-node-service-data.mjs --service sample-node-service-sampled --summary node-summary-sampled.json
      - name: Verify the tail sampler
        run: node scripts/verify-pipeline.mjs --sampled-summary node-summary-sampled.json
      - name: Install Chromium for the screenshots
        if: always()
        run: pnpm exec playwright install --with-deps chromium
      - name: Screenshots of the dashboard
        if: always()
        run: node scripts/screenshot-dashboard.mjs --summary sample-summary.json --out screenshots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Logs of the stack
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
