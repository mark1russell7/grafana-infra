# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@10b3cb8311b894311f86a0ac975f0a047e969f82 # main
    permissions:
      contents: read
      security-events: write
      actions: read
